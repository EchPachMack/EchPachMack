<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NBA FUT Draft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>NBA FUT Draft</h1>
    <div class="stats"><div class="stat-list" id="stats"></div><button id="restart">Новый драфт</button></div>
  </header>
  <main id="app"></main>
  <div id="picker" class="modal" hidden>
    <div class="modal-box">
      <h2 id="picker-title"></h2>
      <p id="picker-sub" class="muted"></p>
      <div class="row" id="picker-cards"></div>
    </div>
  </div>
  <div id="info" class="modal info-modal" hidden>
    <div class="modal-box info-box">
      <button class="close" data-act="close-info" aria-label="Закрыть">✕</button>
      <div id="info-body"></div>
    </div>
  </div>
  <script src="players.js"></script>
  <script src="finance.js"></script>
  <script src="ratings.js"></script>
  <script src="league.js"></script>
  <script src="app.js"></script>
</body>
</html>
