<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBA FUT Draft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>NBA FUT Draft</h1>
    <div class="stats">
      <div>Рейтинг <b id="rating">0</b></div>
      <div>Химия <b id="chem">0/24</b></div>
      <button id="restart">Новый драфт</button>
    </div>
  </header>
  <main>
    <p id="hint"></p>
    <section class="court">
      <div class="row" id="starters"></div>
      <h3>Скамейка</h3>
      <div class="row" id="bench"></div>
    </section>
    <button id="play" class="primary" hidden>Играть турнир</button>
    <section id="results" hidden></section>
    <p class="rules">Химия игрока (0–3): +1 за родную позицию, +1 если в составе есть одноклубник,
      +1 если ещё 4+ игрока из той же конференции. Рейтинги приблизительные.</p>
  </main>
  <div id="picker" class="modal" hidden>
    <div class="modal-box">
      <h2 id="picker-title"></h2>
      <div class="row" id="picker-cards"></div>
    </div>
  </div>
  <script src="players.js"></script>
  <script src="app.js"></script>
</body>
</html>
